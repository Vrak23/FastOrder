<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#e11d48" />
  <meta name="description" content="FastOrder S.A. - Aplicación Web Progresiva para la gestión ágil de pedidos en restaurante con soporte Offline-First." />
  
  <!-- PWA Meta Tags & iOS Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FastOrder" />
  <link rel="apple-touch-icon" href="icons/icon-192.svg" />
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg" />
  <link rel="manifest" href="manifest.webmanifest" />

  <title>FastOrder S.A. | PWA Gestión de Pedidos</title>

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- App Styles -->
  <link rel="stylesheet" href="css/styles.css?v=2.1" />
</head>
<body>

  <!-- 1. Header Principal -->
  <header class="app-header">
    <div class="app-container header-inner">
      <a href="#menu" class="brand-logo" data-tab="menu">
        <div class="brand-icon-wrap">
          <i class="fa-solid fa-burger"></i>
        </div>
        <div class="brand-text-block">
          <span class="brand-title">FastOrder</span>
        </div>
      </a>

      <!-- Desktop Nav Tabs -->
      <nav class="desktop-nav">
        <button class="nav-link active" data-tab="menu">
          <i class="fa-solid fa-bars-staggered"></i> Menú
        </button>
        <button class="nav-link" data-tab="cart">
          <i class="fa-solid fa-cart-shopping"></i> Carrito
          <span id="header-cart-count" class="cart-counter-badge" style="display: none;">0</span>
        </button>
        <button class="nav-link" data-tab="orders">
          <i class="fa-regular fa-file-lines"></i> Mis pedidos
        </button>
        <button class="nav-link" data-tab="kitchen">
          <i class="fa-solid fa-kitchen-set"></i> Cocina KDS
        </button>
      </nav>

      <!-- Utility Actions -->
      <div class="header-actions">
        <div class="online-pill" id="header-online-status">
          <span class="status-dot"></span>
          <span class="status-text">Online</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 2. Connectivity Offline/Online Banner -->
  <div id="connectivity-banner-root"></div>

  <!-- 3. PWA Install Prompt Banner (A2HS) -->
  <div id="pwa-install-banner" class="pwa-install-banner" style="display: none;">
    <div class="pwa-install-info">
      <i class="fa-solid fa-mobile-screen-button"></i>
      <div class="pwa-install-text">
        <strong>Instalar FastOrder en tu Móvil</strong>
        <span>Acceso instantáneo sin consumir memoria y 100% offline.</span>
      </div>
    </div>
    <div class="pwa-install-actions">
      <button id="btn-install-pwa" class="btn-install">Instalar App</button>
      <button id="btn-dismiss-install" class="btn-dismiss-install">&times;</button>
    </div>
  </div>

  <!-- 4. Contenedor de Vistas Dinámicas -->
  <main class="app-container" id="main-content-root">
    <!-- El contenido se inyecta dinámicamente mediante JS (menu, cart, orders, kitchen) -->
  </main>

  <!-- 5. Bottom Navigation Bar para Dispositivos Móviles -->
  <nav class="bottom-nav">
    <button class="bottom-nav-item active" data-tab="menu">
      <i class="fa-solid fa-utensils"></i>
      <span>Menú</span>
    </button>
    <button class="bottom-nav-item" data-tab="cart">
      <i class="fa-solid fa-bag-shopping"></i>
      <span>Carrito</span>
      <span id="bottom-cart-count" class="bottom-cart-badge" style="display: none;">0</span>
    </button>
    <button class="bottom-nav-item" data-tab="orders">
      <i class="fa-solid fa-clock-rotate-left"></i>
      <span>Pedidos</span>
    </button>
    <button class="bottom-nav-item" data-tab="kitchen">
      <i class="fa-solid fa-fire-burner"></i>
      <span>Cocina</span>
    </button>
  </nav>

  <!-- Script Principal de la PWA -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
