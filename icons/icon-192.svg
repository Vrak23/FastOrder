<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="fastOrderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="192" height="192" rx="42" fill="url(#fastOrderGrad)"/>
  <rect x="8" y="8" width="176" height="176" rx="36" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
  
  <!-- FastOrder Icon Graphics -->
  <g filter="url(#shadow)" transform="translate(24, 24)">
    <!-- Burger Top Bun -->
    <path d="M12 56 Q72 16 132 56 L124 64 Q72 50 20 64 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
    <!-- Sesame Seeds -->
    <circle cx="50" cy="42" r="3" fill="#ffffff"/>
    <circle cx="72" cy="36" r="3" fill="#ffffff"/>
    <circle cx="94" cy="44" r="3" fill="#ffffff"/>
    <!-- Lettuce -->
    <path d="M16 66 Q30 76 44 66 Q58 76 72 66 Q86 76 100 66 Q114 76 128 66 L124 74 Q110 82 96 74 Q82 82 68 74 Q54 82 40 74 Q26 82 20 74 Z" fill="#4ade80"/>
    <!-- Patty -->
    <rect x="18" y="78" width="108" height="16" rx="8" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <!-- Cheese -->
    <polygon points="26,86 118,86 110,98 84,106 60,94 36,102" fill="#facc15"/>
    <!-- Burger Bottom Bun -->
    <path d="M22 100 L122 100 Q122 118 72 118 Q22 118 22 100 Z" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
    
    <!-- Lightning Fast Speed Indicator -->
    <path d="M102 18 L76 60 L96 60 L80 96 L126 48 L104 48 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="2" opacity="0.9"/>
  </g>
  
  <!-- Text Label -->
  <text x="96" y="168" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="900" font-size="19" fill="#ffffff" letter-spacing="1">FASTORDER</text>
</svg>
